[project]
name = "ai-influencer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "psycopg[binary]>=3.2,<4", "pillow>=11,<13"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110
