name: ai-influencer
x-app: &app
  build: .
  image: ai-influencer-playground:v3
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://influencer:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@127.0.0.1:55432/influencer
    MEDIA_DIR: /app/data/media
  network_mode: host
  volumes:
    - ./data/media:/app/data/media
    - ./workflows:/app/workflows:ro
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: influencer
      POSTGRES_USER: influencer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U influencer -d influencer"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
